<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AlcoGym</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <span class="logo" aria-hidden="true">🍺</span>
    <div>
      <h1>AlcoGym</h1>
      <p class="tagline">Algorithms, but tipsy.</p>
    </div>
  </header>

  <label class="switch-row" for="enabled">
    <span>
      <b>Rebrand algogym.ru</b>
      <small>Logo, name, title and page text</small>
    </span>
    <span class="switch">
      <input id="enabled" type="checkbox" role="switch">
      <span class="slider" aria-hidden="true"></span>
    </span>
  </label>

  <a class="visit" href="https://algogym.ru" target="_blank" rel="noreferrer">
    Open algogym.ru <span aria-hidden="true">↗</span>
  </a>

  <p class="footnote" id="status">Loading…</p>

  <script src="popup.js"></script>
</body>
</html>
